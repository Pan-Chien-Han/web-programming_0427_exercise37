<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle Properties Calculator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-weight: bold;
        }

        input[type="number"] {
            width: 80%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            border-color: #4CAF50;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 85%;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        .results {
            margin-top: 25px;
            text-align: left;
            background-color: #fafafa;
            padding: 15px;
            border-left: 5px solid #4CAF50;
            border-radius: 4px;
        }

        .results p {
            margin: 8px 0;
            font-size: 16px;
            color: #444;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Circle Calculator</h2>

        <div class="input-group">
            <label for="radiusInput">Enter Radius:</label>
            <input type="number" id="radiusInput" placeholder="e.g., 5" min="0" step="any">
        </div>

        <button onclick="handleCalculation()">Calculate</button>

        <div class="results">
            <p id="circumferenceResult">The circumference is: --</p>
            <p id="areaResult">The area is: --</p>
        </div>
    </div>

    <script>
        //The circumference is NN
        function calcCircumfrence(radius) {
            const circumference = 2 * Math.PI * radius;
            // 使用 toFixed(2) 讓小數點後保留兩位，看起來比較整潔
            document.getElementById('circumferenceResult').innerText = `The circumference is ${circumference.toFixed(2)}`;
        }

        //The area is NN
        function calcArea(radius) {
            const area = Math.PI * Math.pow(radius, 2);
            document.getElementById('areaResult').innerText = `The area is ${area.toFixed(2)}`;
        }

        //
        function handleCalculation() {
            const radiusValue = parseFloat(document.getElementById('radiusInput').value);

            //
            if (isNaN(radiusValue) || radiusValue <= 0) {
                alert("Please enter a valid positive number for the radius.");
                return;
            }


            calcCircumfrence(radiusValue);
            calcArea(radiusValue);
        }
    </script>

</body>

</html>
